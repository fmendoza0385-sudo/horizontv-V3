name: Compilar HorizonTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          set -e
          echo "Contenido de la raíz del repositorio:"
          ls -la
          echo "Contenido de HorizonTV:"
          ls -la HorizonTV
          test -f HorizonTV/settings.gradle.kts
          test -f HorizonTV/build.gradle.kts
          test -f HorizonTV/app/build.gradle.kts
          echo "Estructura Android encontrada correctamente."

      - name: Compilar HorizonTV
        run: gradle -p HorizonTV --no-daemon clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonTV-APK
          path: HorizonTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
